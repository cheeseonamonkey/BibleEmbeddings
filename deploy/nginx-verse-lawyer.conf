# Include only in the public mansion.041700.xyz TLS server block.
# Legacy public links redirect from the VPS hostname; private routes do not move.
# Public site files only; checkpoint and KJV corpus never exposed by Nginx.
location = /verse-lawyer { return 308 /verse-lawyer/; }
location = /verse-lawyer/ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    rewrite ^ /verse-lawyer/index.html last;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}
location = /verse-lawyer/api/health {
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:8794/api/health;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /verse-lawyer/api/analyze {
    if ($request_method != POST) { return 405; }
    client_max_body_size 2k;
    limit_req zone=verse_lawyer_api burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8794/api/analyze;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 45s;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_hide_header Server;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /verse-lawyer/ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    alias /srv/verse-lawyer/site/;
    autoindex off;
    disable_symlinks on;
    try_files $uri =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}
