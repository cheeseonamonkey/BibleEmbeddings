[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-embeddings"
version = "0.1.0"
description = "Claim-conditioned biblical evidence retrieval and NLI"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "rank-bm25>=0.2.2,<1"]

[project.optional-dependencies]
models = ["torch>=2.2", "transformers>=4.48,<5",]
train = ["torch>=2.2", "transformers>=4.48,<5", "datasets>=3,<5", "accelerate>=1,<2", "scikit-learn>=1.3"]

[project.scripts]
verse-lawyer = "bible_embeddings.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
